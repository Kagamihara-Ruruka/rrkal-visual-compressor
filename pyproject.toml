[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rrkal-visual-compressor"
version = "0.1.0"
description = "Large-data visual compression engine for SVG, demo.py, and RRKAL visual assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
vizcompress = "vizcompress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
