name: benchmark-precheck

on:
  push:
    paths:
      - "docs/benchmarks/**"
      - "scripts/**"
      - "src/**"
      - "tests/test_precheck_benchmarks.py"
      - "tests/test_scan_benchmark_fields.py"
      - "tests/test_benchmark_contracts.py"
      - "tests/test_cli_smoke.py"
      - "tests/test_convert_legacy_hardening_reports.py"
      - "pyproject.toml"
      - "requirements*"
  pull_request:
    paths:
      - "docs/benchmarks/**"
      - "scripts/**"
      - "src/**"
      - "tests/test_precheck_benchmarks.py"
      - "tests/test_scan_benchmark_fields.py"
      - "tests/test_benchmark_contracts.py"
      - "tests/test_cli_smoke.py"
      - "tests/test_convert_legacy_hardening_reports.py"
      - "pyproject.toml"
      - "requirements*"

jobs:
  precheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .[dev]
          else
            python -m pip install -e .
          fi
      - name: Run benchmark gate smoke tests
        run: |
          python -m pytest tests/test_precheck_benchmarks.py tests/test_scan_benchmark_fields.py tests/test_benchmark_contracts.py tests/test_cli_smoke.py tests/test_convert_legacy_hardening_reports.py -q
      - name: Run benchmark precheck
        run: |
          set -o pipefail
          python scripts/precheck_benchmarks.py \
            --root docs/benchmarks \
            --pattern "*.json" \
            --scan-out docs/benchmarks/scan_report_ci.json \
            --contract-out docs/benchmarks/contract_matrix_ci.json \
            --fail-on-scan-warning \
            | tee /tmp/precheck_summary_ci.json
      - name: Run parity smoke between copied benchmark artifacts
        run: |
          set -o pipefail
          if [ ! -f docs/benchmarks/terms_channel_kind_threshold_grid_10k_gate.json ]; then
            echo "missing parity fixture: docs/benchmarks/terms_channel_kind_threshold_grid_10k_gate.json"
            exit 1
          fi
          cp docs/benchmarks/terms_channel_kind_threshold_grid_10k_gate.json docs/benchmarks/terms_channel_parity_left_ci.json
          cp docs/benchmarks/terms_channel_kind_threshold_grid_10k_gate.json docs/benchmarks/terms_channel_parity_right_ci.json
          python scripts/compare_terms_channel_benchmark_parity.py \
            --left-root . \
            --right-root . \
            --left-out-json docs/benchmarks/terms_channel_parity_left_ci.json \
            --right-out-json docs/benchmarks/terms_channel_parity_right_ci.json \
            --report-json docs/benchmarks/terms_channel_benchmark_parity_report_ci.json \
            --skip-run \
            --validate-contract \
            --require-contract-pass \
            | tee /tmp/parity_smoke_summary_ci.json
      - name: Validate parity smoke schema and contract status transition
        run: |
          python - <<'PY'
          import json
          with open('docs/benchmarks/terms_channel_benchmark_parity_report_ci.json', 'r', encoding='utf-8') as handle:
              payload = json.load(handle)
          for key in ("schema_version", "left", "right", "status", "contract_validation"):
              if key not in payload:
                  raise SystemExit(f"parity report missing key: {key}")
          if payload["schema_version"] != "1.0":
              raise SystemExit("parity report schema_version must be 1.0")
          contract_validation = payload["contract_validation"]
          if contract_validation.get("status_transition") != "ok->ok":
              raise SystemExit("parity contract status transition must remain ok->ok")
          if contract_validation.get("transition_changed") is not False:
              raise SystemExit("parity contract status transition unexpectedly changed")
          if payload.get("status") != "ok":
              raise SystemExit(f"parity smoke status must be ok, got {payload.get('status')!r}")
          if payload.get("parity_ok") is not True:
              raise SystemExit("parity_ok must be true")
          if payload.get("logical_signature_match") is not True:
              raise SystemExit("logical_signature_match must be true")
          print("parity smoke schema validated")
          PY
      - name: Validate precheck summary schema
        run: |
          python - <<'PY'
          import json
          summary = json.loads(open('/tmp/precheck_summary_ci.json', 'r', encoding='utf-8').read().strip().splitlines()[-1])
          required_keys = {
              'schema_version',
              'root',
              'pattern',
              'scan_ok',
              'contract_ok',
              'scan_report',
              'contract_report',
              'skip_scan',
              'skip_contract',
              'scan',
              'contract',
              'failed_report',
              'status_counts',
              'skipped',
              'skip_reasons',
              'total_inputs',
          }
          missing = sorted(required_keys - set(summary.keys()))
          if missing:
              raise SystemExit(f"precheck summary missing keys: {', '.join(missing)}")
          if not isinstance(summary['scan'], dict):
              raise SystemExit('scan summary must be an object')
          if not isinstance(summary['contract'], dict):
              raise SystemExit('contract summary must be an object')
          if 'status' not in summary['contract']:
              raise SystemExit('contract.status is required')
          if summary['contract']['status'] not in {'ok', 'fail', 'not_run'}:
              raise SystemExit('contract.status must be one of: ok, fail, not_run')
          for key in ('total_inputs', 'skipped'):
              if not isinstance(summary.get(key), int):
                  raise SystemExit(f'{key} must be an integer')
          if not isinstance(summary.get('status_counts'), dict):
              raise SystemExit('status_counts must be an object')
          if not isinstance(summary.get('skip_reasons'), dict):
              raise SystemExit('skip_reasons must be an object')
          if not isinstance(summary.get('schema_version'), str) or not summary['schema_version']:
              raise SystemExit('schema_version must be a non-empty string')
          if not summary['scan_report'].endswith('scan_report_ci.json'):
              raise SystemExit('scan_report path mismatch')
          if not summary['contract_report'].endswith('contract_matrix_ci.json'):
              raise SystemExit('contract_report path mismatch')
          if summary.get('skip_scan') is None:
              raise SystemExit('skip_scan field missing')
          if summary.get('skip_contract') is None:
              raise SystemExit('skip_contract field missing')
          print('precheck summary schema validated')
          PY
